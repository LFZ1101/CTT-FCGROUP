services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cct_intelligence
      POSTGRES_USER: cct
      POSTGRES_PASSWORD: cct_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cctminio
      MINIO_ROOT_PASSWORD: cctminio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 cctminio cctminio_dev_password;
      mc mb -p local/cct-documents || true;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
